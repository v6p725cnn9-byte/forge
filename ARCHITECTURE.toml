[cmake]
libs = [
  "forge_net",
  "forge_game",
  "forge_script",
  "forge_game_net",
  "forge_physics",
  "forge_assets",
  "forge_anim",
  "forge_world",
  "forge_engine",
]
note = "DAG: net; game->net; script->game; game_net->net+game+script+physics; engine->camera/assets/anim/world (not game_net)."

[binaries]
forge = "survival session (menu → host/join)"
labs = ["forge_m1", "forge_m2", "forge_m3", "forge_m4", "forge_m5", "forge_m6", "forge_m7"]

[honest]
done = [
  "game::World is the only gameplay aggregate root (world.actors / world.sim)",
  "world/scenery is props SoA, not gameplay entities",
  "RHI no longer owns HDR/bloom/ACES",
  "Renderer production API is Device+Window; Host is labs-only",
  "FrameGraph: ResourceHandle, Read/Write, first/last lifetime, transients",
  "GPU handles are index+generation",
  "Lua is API over world.actors",
  "client prediction + interpolation + reconcile",
  "Packet lanes 0/1 live, 2/3 reserved; default snapshot 32 / protocol max 128",
  "sector states include Loading/CpuReady/GpuUploading",
  "AssetState on the glTF catalog",
]
thin = [
  "transparent pass is a slot; particles still alpha-mask in opaque",
  "anim graph is gait select, not a full blend tree",
  "IK is collapse_joint only",
  "audio mixer/spatial have no voices/banks yet",
  "save schema v1 encodes pawns, not full world migration",
  "streaming enum is ready; IO-thread loader is not",
  "FrameGraph records lifetime but does not yet alloc/alias GPU transients",
  "shader permutations map to cooked files, not #define variants",
]
next_not_in_this_pass = [
  "prove the stack under load: Window→RHI→FrameGraph→PBR→Jolt→World→net→prediction",
  "async sector IO + GPU residency eviction",
  "ordered per-channel reliable (lane 2)",
  "full client CharacterVirtual prediction",
  "AssetHandle<T> / AssetLoader / GPUReady",
  "SSAO/TAA/fog/material authoring for the visual target",
  "Windows DX12 preset (m0-windows)",
]
known_risks = [
  "kinematic client prediction will desync against Jolt CharacterVirtual on contacts",
  "32 default snapshot entities is an interest default, not a protocol ceiling (128)",
  "game main (shell) still bootstraps via Host; labs too",
]
architectural_debt = [
  "Host still used as process bootstrap in labs and survival main",
  "Client prediction not CharacterVirtual",
  "Asset streaming lacks async IO",
  "FrameGraph lacks transient aliasing and barrier generation",
]
