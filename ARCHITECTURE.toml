# Forge — architecture snapshot for review
# C++20, SDL3 GPU, Jolt, no Unity/Unreal/Godot/Bevy
# Visual target = technical baseline inspired by GTA IV / Sleeping Dogs
# (PBR+CSM+HDR+IBL+ACES). Not a claim that the picture matches those games.

schema = "forge-arch/v3"
project = "forge"
version = "0.9.0"
active_milestone = "A1"

[contract]
source_of_truth = "README.md TOMLMD"
include_root = "src/"
rhi = "SDL3 GPU (Metal now; DX12/Vulkan later via same API + shadercross)"
physics_collision = "Jolt CharacterVirtual + boxes"
locomotion = "standalone C++20 ALS-Refactored concepts, MIT, no Unreal"
assets = "glTF + KTX2/Basis, Mixamo X Bot (own license, not ALS MIT)"
scripts = "Lua 5.4 bindings only; Lua does not own world state"
world_model = "SoA, no GameObject tree"
imgui = "dev overlay only; never shipping UI"

[ownership]
root = "game::World — the only gameplay aggregate"
rule = "World world; world.actors; world.sim; future weather/AI/quests/events/loot/machines/doors hang on World"
lua = "calls spawn/set on world.actors"
network_reads = "world.actors + world.sim"
scenery = "world/scenery SoA + sectors — props only, never players"
rhi = "how we draw: Device/command/buffer/texture/sampler/pipeline/shader/swapchain"
render = "what we draw: renderer + framegraph + passes"
production_gpu = "platform::Window + rhi::Device. render/ui/frontend do not include Host. Host remains labs + game main bootstrap."
transport = "engine/net — UDP, bytes, seq/ACK, FNT1; no Snapshot/Sim/Jolt"
replication = "engine/game_net — packets, server, client, interest, prediction"

[ticks]
sim_hz = 20
net_hz = 20
note = "sim and net are independent knobs that currently share 20. They are not required to stay equal."
render = "variable, display"
animation = "variable, display"
interpolation_delay_s = 0.10
prediction = "kinematic ALS gait speeds, replay unacked input, reconcile on snapshot ack"

[net]
magic_game = "0x37475246"
magic_transport = "0x31544E46" # FNT1
version = 2
default_port = 27015
lanes = [
  "0 unreliable",
  "1 reliable unordered (implemented)",
  "2 reliable ordered (reserved)",
  "3 snapshot (reserved)",
]
reliable = "lane 1: unordered resend until ACK; do not silently promote to ordered"
unreliable = "lane 0: fire-and-forget, dup drop by seq"
packets = ["Hello", "Welcome", "Input", "Snapshot", "Ping", "Pong", "Disconnect", "Event", "ReliableEvent", "Ack", "Resync", "Auth"]
ethernet_mtu = 1500
ipv4_udp_overhead = 28
max_datagram = 1400
transport_header = 17
game_header = 8
default_snapshot_entities = 32
max_snapshot_entities = 128
stream_radius_m = 55.0
authority = "server; Action is a request, server validates recipe/inventory/station/timing"

[handles]
texture = "rhi::TextureHandle { uint32 index; uint32 generation; }"
framegraph_resource = "render::ResourceHandle { uint32 index; uint32 generation; }"
stale = "native() returns null if generation mismatches"

[framegraph]
now = "bind Resources; create_transient allocates GPU; Read/Write; first/last; dead_after. Renderer does not allocate extra transients."
next = [
  "resource lifetime-driven reuse / aliasing",
  "pass dependencies as a DAG",
  "barrier generation",
]

[frame]
flow = "labs: Host. production: Window + Device → Renderer"
opaque = "draw into Renderer HDR+depth"
post = "FrameGraph: bloom READ hdr WRITE bloom; tonemap READ hdr+bloom WRITE swapchain"
ui = "shipping ui:: widgets; backdrop blur is a render pass"

[streaming]
states = ["Empty", "Prefetch", "Loading", "CpuReady", "GpuUploading", "Resident", "Unloading"]
sync_today = "in-radius jumps to Resident; prefetch ring is Prefetch"
next = "Sector → StreamingManager → IO job → decode → CPU asset → GPU upload queue → Resident"

